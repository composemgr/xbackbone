# nginx proxy address - http://172.17.0.1:64391

name: xbackbone
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: pe46dro/xbackbone-docker:latest
    container_name: xbackbone-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: xbackbone-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      APP_NAME: ${APP_ORG_NAME:-XBackBone}
      URL: http://${BASE_HOST_NAME:-$HOSTNAME}:${XBACKBONE_PORT:-64391}
    ports:
      - '172.17.0.1:64391:80'
    volumes:
      - './volumes/config/xbackbone:/app/config:z'
      - './volumes/data/xbackbone:/app/storage:z'
      - './volumes/data/xbackbone/database:/app/resources/database:z'
      - './volumes/logs/xbackbone:/app/logs:z'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - xbackbone

networks:
  xbackbone:
    name: xbackbone
    external: false
